<text class="ts" x="250" y="370">OK</text>
<text class="ts" x="285" y="338">3-wire bundle to PS2 / K1</text>
<text class="ts" x="40" y="392">12 V stays inside the module; the contacts are fed from 5 V, so OK never carries 12 V</text>
