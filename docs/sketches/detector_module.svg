<g class="pink"><rect x="240" y="140" width="70" height="35" rx="4" stroke-width="0.6"/><text class="th" x="275.0" y="157.5" text-anchor="middle" dominant-baseline="central">SD119</text></g>
<g class="purple"><rect x="250" y="200" width="50" height="35" rx="4" stroke-width="0.6"/><text class="ts" x="275.0" y="217.5" text-anchor="middle" dominant-baseline="central">K3 12 V</text></g>
<rect x="170" y="318" width="100" height="32" rx="6" fill="#888780" opacity="0.18"/>
