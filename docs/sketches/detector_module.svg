.green>rect{fill:#EAF3DE;stroke:#3B6D11}.green>text{fill:#27500A}
.haz{fill:#A32D2D;font-size:14px;font-weight:bold}
</style><rect width="680" height="400" fill="#ffffff"/>
<rect x="140" y="40" width="360" height="270" fill="none" stroke="#5F5E5A" stroke-width="0.6" stroke-dasharray="3 3"/>
